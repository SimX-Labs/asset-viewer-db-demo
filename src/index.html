<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SimX Asset Database</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the persisted color theme before first paint to avoid a flash of
      // the wrong theme. Kept in sync at runtime by ThemeService.
      (function () {
        try {
          var stored = localStorage.getItem('simx-asset-viewer-theme');
          var dark = false;
          if (stored === 'dark') {
            dark = true;
          } else if (stored === 'light') {
            dark = false;
          } else if (window.matchMedia) {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.classList.toggle('simx-dark', dark);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Source+Code+Pro:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
